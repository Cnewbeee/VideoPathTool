name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Building the editor also builds the console project it references.
      - name: Build
        run: dotnet build VideoPathTool.UI/VideoPathTool.UI.csproj -c Release

      - name: Build console tool
        run: dotnet build VideoPathTool/VideoPathTool.csproj -c Release
